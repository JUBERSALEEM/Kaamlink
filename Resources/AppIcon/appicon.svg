<?xml version="1.0" encoding="UTF-8"?>
<!--
    KaamLink legacy/launcher icon (full bleed). The adaptive foreground is
    appiconfg.svg; KaamLink.csproj supplies the adaptive background colour.
    Rich clay gradient + linked-K mark, kept inside the 108dp safe canvas.
-->
<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kaamlink-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B91FF"/>
      <stop offset="0.52" stop-color="#075FC2"/>
      <stop offset="1" stop-color="#0A1322"/>
    </linearGradient>
    <linearGradient id="kaamlink-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7D5FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A1322" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#kaamlink-bg)"/>
  <!-- Ambient light and deep clay edge. -->
  <circle cx="6" cy="4" r="58" fill="#8DBBFF" opacity="0.20"/>
  <circle cx="102" cy="106" r="52" fill="#050A12" opacity="0.30"/>
  <rect x="3" y="3" width="102" height="102" rx="29" fill="none"
        stroke="url(#kaamlink-rim)" stroke-width="2"/>
  <!-- Subtle shadow under the mark, then crisp white K and mint link. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.2 1.8)">
    <path d="M34 25v58M74 28 43 54l32 27" stroke="#050A12" stroke-opacity="0.42" stroke-width="12"/>
    <path d="M51 54h22" stroke="#050A12" stroke-opacity="0.35" stroke-width="10"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 25v58M74 28 43 54l32 27" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M51 54h22" stroke="#62E6CF" stroke-width="8"/>
    <circle cx="74" cy="54" r="6" fill="#62E6CF" stroke="none"/>
    <circle cx="74" cy="54" r="12" fill="#62E6CF" opacity="0.18" stroke="none"/>
  </g>
</svg>
