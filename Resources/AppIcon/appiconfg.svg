<?xml version="1.0" encoding="UTF-8"?>
<!-- Worker helmet + connected skill nodes in a raised, adaptive-safe medallion. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="medallion" x1="30" y1="25" x2="77" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8F5F1"/>
    </linearGradient>
    <linearGradient id="helmet" x1="38" y1="33" x2="72" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1675BC"/>
      <stop offset="1" stop-color="#083B72"/>
    </linearGradient>
    <linearGradient id="link" x1="36" y1="68" x2="73" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19AFA8"/>
      <stop offset="1" stop-color="#49D8C4"/>
    </linearGradient>
  </defs>
  <!-- The full mark stays within Android's adaptive-icon safe circle. -->
  <circle cx="54" cy="55" r="31.5" fill="#04294A" fill-opacity=".36"/>
  <circle cx="54" cy="53" r="31.5" fill="url(#medallion)" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="1.5"/>
  <circle cx="54" cy="53" r="27.5" fill="none" stroke="#78D9D1" stroke-opacity=".3" stroke-width="1"/>

  <!-- Practical-work helmet with a bright ridge, not a text glyph. -->
  <path d="M35 51v-2a19 19 0 0 1 38 0v2H35Z" fill="url(#helmet)"/>
  <path d="M30 51h48c2 0 3.5 1.5 3.5 3.5S80 58 78 58H30c-2 0-3.5-1.5-3.5-3.5S28 51 30 51Z" fill="#073B70"/>
  <path d="M54 32v18" stroke="#65E0CD" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M39 44c1.2-5.3 5.2-9.3 10.3-10.7" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Linked skill nodes: employer and worker connected through verified ability. -->
  <path d="M42 72h24" stroke="url(#link)" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="39" cy="72" r="6" fill="#0C8D94"/>
  <circle cx="69" cy="72" r="6" fill="#19B9AC"/>
  <circle cx="39" cy="72" r="2.2" fill="#DFFFF9"/>
  <circle cx="69" cy="72" r="2.2" fill="#DFFFF9"/>
  <circle cx="54" cy="72" r="2.1" fill="#E8FFF9"/>
</svg>
